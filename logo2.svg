<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Circular boundary clip for clean edge -->
    <clipPath id="nekoClip">
      <circle cx="16" cy="16" r="16" />
    </clipPath>
    <!-- Ear Pink Gradient -->
    <linearGradient id="earInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>
    <!-- Amber Eye Gradient -->
    <linearGradient id="eyeAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <!-- Golden Medal Gradient -->
    <linearGradient id="goldMedal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
  </defs>

  <!-- Deep Blue Background -->
  <rect width="32" height="32" fill="#0b1220" />

  <g clip-path="url(#nekoClip)">
    <!-- ===== EARS ===== -->
    <!-- Left Ear (Orange) -->
    <path d="M 5.8 15 C 4.5 10 5.2 3.8 8.8 3.2 C 11.2 2.8 13.5 7.5 14.8 10.5 Z" fill="#ea580c" stroke="#9a3412" stroke-width="0.5" stroke-linejoin="round" />
    <!-- Left Inner Ear -->
    <path d="M 7.2 13.2 C 6.5 9.5 7.2 5.5 9 5.2 C 10.4 5 12.2 8.5 13 10.5 Z" fill="url(#earInner)" />
    <!-- Left Ear Tuft -->
    <path d="M 7.8 11.5 Q 9 9.8 10 11.2" stroke="#ea580c" stroke-width="0.5" fill="none" stroke-linecap="round" />

    <!-- Right Ear (Dark Charcoal) -->
    <path d="M 26.2 15 C 27.5 10 26.8 3.8 23.2 3.2 C 20.8 2.8 18.5 7.5 17.2 10.5 Z" fill="#1f2937" stroke="#111827" stroke-width="0.5" stroke-linejoin="round" />
    <!-- Right Inner Ear -->
    <path d="M 24.8 13.2 C 25.5 9.5 24.8 5.5 23 5.2 C 21.6 5 19.8 8.5 19 10.5 Z" fill="url(#earInner)" />
    <!-- Right Ear Tuft -->
    <path d="M 24.2 11.5 Q 23 9.8 22 11.2" stroke="#1f2937" stroke-width="0.5" fill="none" stroke-linecap="round" />

    <!-- ===== MAIN HEAD BASE (Cream White) ===== -->
    <path d="M 4.5 17.5 C 4 22 8 26.5 16 26.5 C 24 26.5 28 22 27.5 17.5 C 27 12.5 22 8.5 16 8.5 C 10 8.5 5 12.5 4.5 17.5 Z" fill="#fffdfa" stroke="#4b5563" stroke-width="0.45" />

    <!-- ===== CALICO COLOR PATCHES ===== -->
    <!-- Left Orange Face Patch -->
    <path d="M 5 16.5 C 4.5 12 8 8.5 13.5 9 C 14.8 9.5 15.5 12 14.2 13.8 C 12.8 15.5 11 17 6.5 18 Z" fill="#f97316" />
    <!-- Darker Orange Contour Cheek Shade -->
    <path d="M 5.2 17.5 C 5 16 6 15 7.5 15.5 C 6.5 17 5.8 18 5.2 17.5 Z" fill="#c2410c" opacity="0.6" />
    <!-- Orange Brow Patch -->
    <ellipse cx="12.5" cy="11.5" rx="1.2" ry="0.7" fill="#ea580c" />

    <!-- Right Dark Slate Face Patch -->
    <path d="M 27 16.5 C 27.5 12 24 8.5 18.5 9 C 17.2 9.5 16.5 12 17.8 13.8 C 19.2 15.5 21 17 25.5 18 Z" fill="#1f2937" />
    <!-- Golden Accent Spot in Dark Patch -->
    <circle cx="21.5" cy="11.8" r="1.1" fill="#f59e0b" />

    <!-- White Forehead Blaze Peak -->
    <path d="M 16 8.6 C 17.5 10.5 17.2 12.8 16 14.2 C 14.8 12.8 14.5 10.5 16 8.6 Z" fill="#ffffff" />

    <!-- ===== EYES (Expressive Big Anime Style) ===== -->
    <!-- Left Eye -->
    <g>
      <!-- Eyelash / Outline -->
      <path d="M 9.2 15.8 C 10 14.2 13.8 14.2 14.6 15.8 C 14.2 18.8 9.6 18.8 9.2 15.8 Z" fill="#111827" />
      <!-- Iris -->
      <ellipse cx="11.9" cy="16.2" rx="2.2" ry="2.7" fill="url(#eyeAmber)" />
      <!-- Pupil -->
      <ellipse cx="12.1" cy="16.2" rx="1.5" ry="2" fill="#18181b" />
      <!-- Large White Highlight -->
      <circle cx="11.2" cy="15" r="0.85" fill="#ffffff" />
      <!-- Secondary Highlight -->
      <circle cx="12.7" cy="17.2" r="0.4" fill="#ffffff" />
      <!-- Eye Corner Flick -->
      <path d="M 9.5 15 C 8.8 14.6 8.2 15 8.2 15" stroke="#111827" stroke-width="0.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Right Eye -->
    <g>
      <!-- Eyelash / Outline -->
      <path d="M 22.8 15.8 C 22 14.2 18.2 14.2 17.4 15.8 C 17.8 18.8 22.4 18.8 22.8 15.8 Z" fill="#111827" />
      <!-- Iris -->
      <ellipse cx="20.1" cy="16.2" rx="2.2" ry="2.7" fill="url(#eyeAmber)" />
      <!-- Pupil -->
      <ellipse cx="19.9" cy="16.2" rx="1.5" ry="2" fill="#18181b" />
      <!-- Large White Highlight -->
      <circle cx="19.2" cy="15" r="0.85" fill="#ffffff" />
      <!-- Secondary Highlight -->
      <circle cx="20.7" cy="17.2" r="0.4" fill="#ffffff" />
      <!-- Eye Corner Flick -->
      <path d="M 22.5 15 C 23.2 14.6 23.8 15 23.8 15" stroke="#111827" stroke-width="0.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- ===== NOSE & CAT MOUTH ===== -->
    <!-- Pink Cute Nose -->
    <path d="M 15.1 19.4 C 15.4 19.2 16.6 19.2 16.9 19.4 C 17.1 19.8 16.2 20.6 16 20.6 C 15.8 20.6 14.9 19.8 15.1 19.4 Z" fill="#f43f5e" />
    <!-- Smiling Mouth Line :3 -->
    <path d="M 13.8 20.8 C 14.8 22 16 21.6 16 20.6 C 16 21.6 17.2 22 18.2 20.8" fill="none" stroke="#374151" stroke-width="0.65" stroke-linecap="round" />

    <!-- Whisker Details (Left & Right) -->
    <path d="M 6.8 19 L 10.5 19.8 M 6.5 21.2 L 10.2 21.2" stroke="#94a3b8" stroke-width="0.45" stroke-linecap="round" />
    <path d="M 25.2 19 L 21.5 19.8 M 25.5 21.2 L 21.8 21.2" stroke="#94a3b8" stroke-width="0.45" stroke-linecap="round" />

    <!-- ===== RED COLLAR ===== -->
    <path d="M 9.5 25.8 C 13.5 28.5 18.5 28.5 22.5 25.8 C 22.8 26.6 22 27.5 16 28.5 C 10 27.5 9.2 26.6 9.5 25.8 Z" fill="#dc2626" stroke="#991b1b" stroke-width="0.4" />

    <!-- ===== GOLD MEDAL WITH LIGHTNING BOLT ===== -->
    <!-- Medal Outer Ring -->
    <circle cx="16" cy="28.6" r="2.8" fill="url(#goldMedal)" stroke="#854d0e" stroke-width="0.4" />
    <!-- Medal Inner Groove -->
    <circle cx="16" cy="28.6" r="2.2" fill="none" stroke="#fef08a" stroke-width="0.3" opacity="0.8" />
    <!-- Lightning Bolt (Rayo de la medalla) -->
    <polygon points="16.3,26.9 14.8,28.6 16.1,28.6 15.6,30.3 17.4,28.3 16.2,28.3" fill="#854d0e" stroke="#713f12" stroke-width="0.15" stroke-linejoin="round" />
  </g>
</svg>